<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>FC Lagos</title>
</head>
<body>
    
   <nav class="navbar">

    <div class="logo">
        <span class="logo-icon">⚽</span>
        <span>FC Lagos</span>
    </div>

    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Squad</a>
        <a href="#">Fixtures</a>
        <a href="#">News</a>
        <a href="#">Contact</a>
    </div>

</nav>

<section class="hero">

    <div class="hero-content">

        <h1>Welcome to FC Lagos</h1>

        <p>
            Home of passion, excellence and unforgettable football moments.
        </p>

        <div class="hero-buttons">
            <button class="primary-btn">View Squad</button>
            <button class="secondary-btn">Fixtures</button>
        </div>

    </div>

</section>

    <section class="stats-bar">
        <div class="stat">
            <h3>38</h3>
            <p>Matches Played</p>
        </div>
        <div class="stat">
            <h3>24</h3>
            <p>Wins</p>
        </div>
        <div class="stat">
            <h3>8</h3>
            <p>Draws</p>
        </div>
        <div class="stat">
            <h3>6</h3>
            <p>Losses</p>
        </div>
    </section>

    <section class="players-grid">
        <div class="player-card">Osimhen -- ST</div>
        <div class="player-card">Iheanacho -- AM</div>
        <div class="player-card">Chukwueze -- RW</div>
        <div class="player-card">Ndidi -- DM</div>
        <div class="player-card">Bassey -- CB</div>
        <div class="player-card">Okoye -- GK</div>
    </section>


</body>
</html>
